[package]
name = "luminatti"
version = "0.1.1"
edition = "2024"
description = "A fast, mouse-aware worktree diff review TUI"
homepage = "https://github.com/jteso/luminatti-cli"
repository = "https://github.com/jteso/luminatti-cli"
license = "MIT"

[[bin]]
name = "luminatti-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arboard = "3.4"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
difftastic = { path = "vendor/difftastic" }
globset = "0.4"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "2.6"
unicode-width = "0.2"
uuid = { version = "1.11", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
